[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-registry"
version = "0.5.0"
description = "Registry of scientific experiment results (Professional Python, lab 5)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Volodymyr Nakladiuk" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "types-PyYAML"]

[project.scripts]
experiment-registry = "experiment_registry.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
