name: CI lab10 (experiment-registry)

on:
  push:
    branches: [main]
    paths: ["lab10/**", ".github/workflows/lab10-ci.yml"]
  pull_request:
    paths: ["lab10/**", ".github/workflows/lab10-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: lab10

jobs:
  quality:
    name: Lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab10/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests with coverage
        run: pytest -v --cov --cov-report=term-missing

  package:
    name: Build wheel and sdist
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check dist
        run: ls -la dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/experiment-registry --help
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: experiment-registry-dist
          path: lab10/dist/

  docker:
    name: Docker build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker build
        run: docker build -t experiment-registry:ci .
      - name: Run container and check /health
        run: |
          docker run -d --name api -p 8000:8000 experiment-registry:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
