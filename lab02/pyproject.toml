[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-registry"
version = "0.2.0"
description = "Registry of scientific experiment results (Professional Python, lab 2)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Volodymyr Nakladiuk" }]

[project.scripts]
experiment-registry = "experiment_registry.main:main"

[tool.setuptools.packages.find]
where = ["src"]
