[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-registry"
version = "0.9.0"
description = "Registry of scientific experiment results (Professional Python, lab 9)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Volodymyr Nakladiuk" }]
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "types-PyYAML",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx2",  # transport required by starlette.testclient in current Starlette releases
]

[project.scripts]
experiment-registry = "experiment_registry.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["integration: integration tests (several components together)"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["experiment_registry"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
