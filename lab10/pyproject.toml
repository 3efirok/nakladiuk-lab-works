[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-registry"
version = "1.0.0"
description = "Registry of scientific experiment results: REST API, persistence, import/export and analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Volodymyr Nakladiuk" }]
keywords = ["experiments", "research", "fastapi", "sqlalchemy", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "types-PyYAML",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx2",  # transport required by starlette.testclient in current Starlette releases
    "ruff>=0.5",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/3efirok/nakladiuk-lab-works"
Documentation = "https://github.com/3efirok/nakladiuk-lab-works/tree/main/lab10#readme"

[project.scripts]
experiment-registry = "experiment_registry.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
experiment_registry = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["integration: integration tests (several components together)"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["experiment_registry"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
